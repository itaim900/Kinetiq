<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kinetiq</title>
    <script>
      // Apply the theme before anything renders (no white flash in night mode).
      // Same rule as src/lib/theme.ts: saved choice, else the device setting.
      (function () {
        var t = 'light';
        try {
          var saved = localStorage.getItem('kinetiq_theme');
          if (saved === 'light' || saved === 'dark') t = saved;
          else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
        } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
