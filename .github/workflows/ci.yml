# Continuous Integration: on every push / PR, build and test both halves of the
# app on a clean Ubuntu machine. This is the "does it work on a machine that
# isn't my laptop?" safety net. The backend build steps here mirror exactly what
# the backend Dockerfile will do later (same Linux + apt packages).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (C++ build + tests)
    runs-on: ubuntu-latest

    # A throwaway Postgres for the integration tests. The DbTest harness creates
    # a "kinetiq_test" database on it and applies migrations; unit tests ignore it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kinetiq
          POSTGRES_USER: kinetiq
          POSTGRES_PASSWORD: kinetiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kinetiq"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Crow (asio) + libpq + gtest from apt. We deliberately do NOT install
      # libpqxx-dev: Ubuntu's package has a header/lib std::source_location
      # mismatch, so we build libpqxx from source (KINETIQ_FETCH_LIBPQXX=ON).
      # Phase 2 auth deps: libargon2-dev (password hashing) + libssl-dev
      # (OpenSSL, used by jwt-cpp which is fetched from source at configure time).
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ git \
            libasio-dev \
            libpq-dev \
            libgtest-dev \
            libargon2-dev libssl-dev

      - name: Configure
        working-directory: Server
        run: cmake --preset default -DKINETIQ_FETCH_LIBPQXX=ON

      - name: Build
        working-directory: Server
        run: cmake --build build

      - name: Test
        working-directory: Server
        # DB_* point at the Postgres service so integration tests run for real
        # (they self-skip if the DB is unreachable).
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: kinetiq
          DB_PASSWORD: kinetiq
        run: ctest --test-dir build --output-on-failure

  frontend:
    name: Frontend (React build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install dependencies
        working-directory: Client
        run: npm ci

      - name: Test
        working-directory: Client
        run: npm test

      - name: Build
        working-directory: Client
        run: npm run build
