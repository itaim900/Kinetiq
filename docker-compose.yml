services:
  postgres:
    image: postgres:16
    container_name: fitapp-postgres
    environment:
      POSTGRES_DB: fitapp
      POSTGRES_USER: fitapp
      POSTGRES_PASSWORD: fitapp
    ports:
      # Host port is configurable to avoid clashing with a local Postgres.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - fitapp_pgdata:/var/lib/postgresql/data
      # No initdb.d mount: migrations are applied by the backend on startup
      # (run `fitapp_server` locally, or use docker-compose.prod.yml).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitapp -d fitapp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fitapp_pgdata:
