services:
  postgres:
    image: postgres:16
    container_name: kinetiq-postgres
    environment:
      POSTGRES_DB: kinetiq
      POSTGRES_USER: kinetiq
      POSTGRES_PASSWORD: kinetiq
    ports:
      # Host port is configurable to avoid clashing with a local Postgres.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - kinetiq_pgdata:/var/lib/postgresql/data
      # No initdb.d mount: migrations are applied by the backend on startup
      # (run `kinetiq_server` locally, or use docker-compose.prod.yml).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinetiq -d kinetiq"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kinetiq_pgdata:
