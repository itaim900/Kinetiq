# Full-app stack using prebuilt images from GitHub Container Registry (GHCR).
# The heavy image builds happen in CI; here we just pull and run.
#
#   docker compose -f docker-compose.prod.yml pull   # get latest images
#   docker compose -f docker-compose.prod.yml up -d   # run the whole app
#
# Then open http://localhost:3000
#
# Image owner can be overridden, e.g. IMAGE_OWNER=someoneelse docker compose ...
services:
  postgres:
    image: postgres:16
    container_name: kinetiq-postgres
    environment:
      POSTGRES_DB: kinetiq
      POSTGRES_USER: kinetiq
      POSTGRES_PASSWORD: kinetiq
    volumes:
      - kinetiq_pgdata:/var/lib/postgresql/data
      # No initdb.d mount: the backend applies migrations on startup (it ships
      # the SQL in its image and owns the schema).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinetiq -d kinetiq"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/${IMAGE_OWNER:-itaim900}/kinetiq-backend:latest
    container_name: kinetiq-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BIND_ADDR: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: kinetiq
      DB_USER: kinetiq
      DB_PASSWORD: kinetiq
    ports:
      # Exposed for convenience (e.g. curl /api/v1/health directly). Optional.
      - "8080:8080"

  frontend:
    image: ghcr.io/${IMAGE_OWNER:-itaim900}/kinetiq-frontend:latest
    container_name: kinetiq-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  kinetiq_pgdata:
