# Full-app stack using prebuilt images from GitHub Container Registry (GHCR).
# The heavy image builds happen in CI; here we just pull and run.
#
#   docker compose -f docker-compose.prod.yml pull   # get latest images
#   docker compose -f docker-compose.prod.yml up -d   # run the whole app
#
# Then open http://localhost:3000
#
# Image owner can be overridden, e.g. IMAGE_OWNER=someoneelse docker compose ...
services:
  postgres:
    image: postgres:16
    container_name: fitapp-postgres
    environment:
      POSTGRES_DB: fitapp
      POSTGRES_USER: fitapp
      POSTGRES_PASSWORD: fitapp
    volumes:
      - fitapp_pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitapp -d fitapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/${IMAGE_OWNER:-itaim900}/fit-app-backend:latest
    container_name: fitapp-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BIND_ADDR: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fitapp
      DB_USER: fitapp
      DB_PASSWORD: fitapp
    ports:
      # Exposed for convenience (e.g. curl /api/v1/health directly). Optional.
      - "8080:8080"

  frontend:
    image: ghcr.io/${IMAGE_OWNER:-itaim900}/fit-app-frontend:latest
    container_name: fitapp-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  fitapp_pgdata:
